openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Universal AI Shopping Agent API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: shopping
    description: Shopping search, products, and preferences
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /shopping/search:
    post:
      operationId: searchProducts
      tags: [shopping]
      summary: Search for products using AI-powered query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchProductsBody"
      responses:
        "200":
          description: Ranked product results with AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchProductsResponse"

  /shopping/products/{id}:
    get:
      operationId: getProduct
      tags: [shopping]
      summary: Get detailed product info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /shopping/saved:
    get:
      operationId: listSavedProducts
      tags: [shopping]
      summary: List saved/wishlisted products
      responses:
        "200":
          description: List of saved products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedProduct"
    post:
      operationId: saveProduct
      tags: [shopping]
      summary: Save a product to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProductBody"
      responses:
        "201":
          description: Saved product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedProduct"

  /shopping/saved/{id}:
    delete:
      operationId: removeSavedProduct
      tags: [shopping]
      summary: Remove a saved product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /shopping/history:
    get:
      operationId: listSearchHistory
      tags: [shopping]
      summary: Get recent search history
      responses:
        "200":
          description: List of recent searches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHistoryEntry"

  /shopping/preferences:
    get:
      operationId: getPreferences
      tags: [shopping]
      summary: Get user preferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    put:
      operationId: updatePreferences
      tags: [shopping]
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /shopping/trending:
    get:
      operationId: getTrendingProducts
      tags: [shopping]
      summary: Get trending products by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trending products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /shopping/compare:
    post:
      operationId: compareProducts
      tags: [shopping]
      summary: Compare multiple products side by side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareProductsBody"
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareProductsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        brand:
          type: string
        price:
          type: number
        originalPrice:
          type: ["number", "null"]
        currency:
          type: string
        discount:
          type: ["number", "null"]
        rating:
          type: ["number", "null"]
        reviewCount:
          type: ["integer", "null"]
        imageUrl:
          type: string
        productUrl:
          type: string
        source:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        deliveryInfo:
          type: ["string", "null"]
        inStock:
          type: boolean
        trustScore:
          type: ["number", "null"]
        qualityScore:
          type: ["number", "null"]
        valueScore:
          type: ["number", "null"]
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - brand
        - price
        - originalPrice
        - currency
        - discount
        - rating
        - reviewCount
        - imageUrl
        - productUrl
        - source
        - category
        - description
        - deliveryInfo
        - inStock
        - trustScore
        - qualityScore
        - valueScore
        - pros
        - cons

    SearchProductsBody:
      type: object
      properties:
        query:
          type: string
        filters:
          type: object
          properties:
            minPrice:
              type: ["number", "null"]
            maxPrice:
              type: ["number", "null"]
            category:
              type: ["string", "null"]
            sources:
              type: array
              items:
                type: string
          required:
            - minPrice
            - maxPrice
            - category
            - sources
        conversationId:
          type: ["integer", "null"]
      required:
        - query
        - filters
        - conversationId

    SearchProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        aiSummary:
          type: string
        intent:
          type: object
          properties:
            productType:
              type: string
            attributes:
              type: array
              items:
                type: string
            budget:
              type: ["number", "null"]
          required:
            - productType
            - attributes
            - budget
        totalFound:
          type: integer
      required:
        - products
        - aiSummary
        - intent
        - totalFound

    SavedProduct:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: string
        title:
          type: string
        brand:
          type: string
        price:
          type: number
        currency:
          type: string
        imageUrl:
          type: string
        productUrl:
          type: string
        source:
          type: string
        rating:
          type: ["number", "null"]
        savedAt:
          type: string
          format: date-time
      required:
        - id
        - productId
        - title
        - brand
        - price
        - currency
        - imageUrl
        - productUrl
        - source
        - rating
        - savedAt

    SaveProductBody:
      type: object
      properties:
        productId:
          type: string
        title:
          type: string
        brand:
          type: string
        price:
          type: number
        currency:
          type: string
        imageUrl:
          type: string
        productUrl:
          type: string
        source:
          type: string
        rating:
          type: ["number", "null"]
      required:
        - productId
        - title
        - brand
        - price
        - currency
        - imageUrl
        - productUrl
        - source
        - rating

    SearchHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        query:
          type: string
        resultsCount:
          type: integer
        searchedAt:
          type: string
          format: date-time
      required:
        - id
        - query
        - resultsCount
        - searchedAt

    UserPreferences:
      type: object
      properties:
        id:
          type: integer
        favoriteBrands:
          type: array
          items:
            type: string
        preferredSources:
          type: array
          items:
            type: string
        defaultCurrency:
          type: string
        preferredCategories:
          type: array
          items:
            type: string
        budgetRange:
          type: object
          properties:
            min:
              type: ["number", "null"]
            max:
              type: ["number", "null"]
          required:
            - min
            - max
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - favoriteBrands
        - preferredSources
        - defaultCurrency
        - preferredCategories
        - budgetRange
        - updatedAt

    UpdatePreferencesBody:
      type: object
      properties:
        favoriteBrands:
          type: array
          items:
            type: string
        preferredSources:
          type: array
          items:
            type: string
        defaultCurrency:
          type: string
        preferredCategories:
          type: array
          items:
            type: string
        budgetMin:
          type: ["number", "null"]
        budgetMax:
          type: ["number", "null"]
      required:
        - favoriteBrands
        - preferredSources
        - defaultCurrency
        - preferredCategories
        - budgetMin
        - budgetMax

    CompareProductsBody:
      type: object
      properties:
        productIds:
          type: array
          items:
            type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required:
        - productIds
        - products

    CompareProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        winner:
          type: string
        winnerReason:
          type: string
        comparisonTable:
          type: array
          items:
            type: object
            properties:
              attribute:
                type: string
              values:
                type: array
                items:
                  type: string
            required:
              - attribute
              - values
      required:
        - products
        - winner
        - winnerReason
        - comparisonTable
