version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "25206:25206"
    environment:
      - NODE_ENV=development
      - PORT=25206
      - API_SERVER_URL=http://localhost:8080
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
