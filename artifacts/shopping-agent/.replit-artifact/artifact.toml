kind = "web"
previewPath = "/"
title = "Universal AI Shopping Agent"
version = "1.0.0"
id = "artifacts/shopping-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25206

[services.development]
run = "pnpm --filter @workspace/shopping-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shopping-agent", "run", "build" ]
publicDir = "artifacts/shopping-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25206"
BASE_PATH = "/"
